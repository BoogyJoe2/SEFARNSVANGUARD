<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fashion Design Studio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <h1>✦ Fashion Design Studio</h1>
      <div class="header-actions">
        <button class="btn" id="resetBtn">Reset</button>
        <button class="btn" id="exportBtn">Export Look</button>
      </div>
    </header>

    <div class="main">
      <!-- Left Sidebar - Categories -->
      <aside class="sidebar left">
        <h2>Categories</h2>
        <div class="category-list">
          <button class="cat-btn active" data-category="tops">Tops</button>
          <button class="cat-btn" data-category="trousers">Trousers</button>
          <button class="cat-btn" data-category="dresses">Dresses</button>
          <button class="cat-btn" data-category="jackets">Jackets</button>
          <button class="cat-btn" data-category="fabrics">Fabrics</button>
        </div>

        <h3 id="itemsTitle">Tops</h3>
        <div class="items-grid" id="itemsGrid">
          <!-- Dynamically filled -->
        </div>
      </aside>

      <!-- Center - Virtual Mannequin -->
      <main class="mannequin-area">
        <div class="mannequin-wrapper">
          <svg id="mannequin" viewBox="0 0 200 480" xmlns="http://www.w3.org/2000/svg">
            <!-- Head -->
            <ellipse cx="100" cy="40" rx="28" ry="32" fill="#f5d0c5" stroke="#333" stroke-width="1.5"/>
            <!-- Neck -->
            <rect x="92" y="70" width="16" height="25" fill="#f5d0c5"/>
            
            <!-- Torso base -->
            <path id="torso" d="M70 115 Q100 110 130 115 L140 220 Q100 240 60 220 Z" fill="#e8c4b8" stroke="#333" stroke-width="1"/>
            
            <!-- Arms -->
            <path d="M70 120 Q40 160 45 210" fill="none" stroke="#f5d0c5" stroke-width="18" stroke-linecap="round"/>
            <path d="M130 120 Q160 160 155 210" fill="none" stroke="#f5d0c5" stroke-width="18" stroke-linecap="round"/>
            
            <!-- Legs base -->
            <path d="M80 230 Q70 350 75 420" fill="none" stroke="#f5d0c5" stroke-width="22" stroke-linecap="round"/>
            <path d="M120 230 Q130 350 125 420" fill="none" stroke="#f5d0c5" stroke-width="22" stroke-linecap="round"/>
            
            <!-- Clothing layers -->
            <g id="clothingLayers">
              <path id="jacket" class="clothing" d="" fill="none" stroke="none"/>
              <path id="dress" class="clothing" d="" fill="none" stroke="none"/>
              <path id="top" class="clothing" d="" fill="none" stroke="none"/>
              <path id="trousers" class="clothing" d="" fill="none" stroke="none"/>
            </g>
          </svg>
        </div>
        <p class="hint">Select items from the left • Color & fabric from the right</p>
      </main>

      <!-- Right Sidebar - Colors & Fabrics -->
      <aside class="sidebar right">
        <h2>Color Palette</h2>
        <div class="color-palette" id="colorPalette">
          <!-- Colors generated by JS -->
        </div>

        <h2>Fabric Textures</h2>
        <div class="fabric-grid" id="fabricGrid">
          <!-- Fabrics generated by JS -->
        </div>

        <div class="selected-info">
          <p>Selected: <span id="selectedItem">None</span></p>
          <p>Color: <span id="selectedColor">—</span></p>
          <p>Fabric: <span id="selectedFabric">—</span></p>
        </div>
      </aside>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
